name: EQ test APK

on:
  push:
    branches: [test/apk-336-system-eq]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Audio source guards
        run: ./gradlew :app:testDebugUnitTest --tests com.pokedaisy.app.GameAudioTrackTest --tests com.pokedaisy.app.PerformanceGuardsTest --stacktrace
      - name: Build installable ARM64 APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify APK and prepare download
        run: |
          mkdir -p apk-download
          cp app/build/outputs/apk/debug/app-debug.apk apk-download/PokeDaisy-EQ-test-arm64.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose apk-download/PokeDaisy-EQ-test-arm64.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging apk-download/PokeDaisy-EQ-test-arm64.apk | head -n 5
          cd apk-download
          sha256sum PokeDaisy-EQ-test-arm64.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PokeDaisy-EQ-test-arm64
          path: apk-download/
          if-no-files-found: error
          retention-days: 14
